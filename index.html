<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Real World CE | Prostate PARPi Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    
    
  <style>
    :root{
      --navy:#0b1f3a;
      --navy-2:#102a4c;
      --blue:#2f6df6;
      --sky:#63b3ff;
      --cyan:#7dd3fc;
      --slate:#0f172a;
      --border:rgba(148,163,184,.18);
      --panel:rgba(255,255,255,.82);
      --glass:blur(20px);
      --shadow:0 20px 60px rgba(2,6,23,.10);
      --shadow-strong:0 24px 80px rgba(15,23,42,.16);
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter',sans-serif;
      min-height:100vh;
      color:#0f172a;
      background:
        radial-gradient(circle at top left, rgba(96,165,250,.20), transparent 28%),
        radial-gradient(circle at top right, rgba(56,189,248,.14), transparent 30%),
        linear-gradient(180deg, #f8fbff 0%, #eef5ff 45%, #f8fafc 100%);
    }

    .custom-scroll::-webkit-scrollbar { width: 8px; height:8px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,.55); border-radius: 999px; }

    .glass-panel{
      background:var(--panel);
      backdrop-filter:var(--glass);
      -webkit-backdrop-filter:var(--glass);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
    }

    .glass-dark{
      position:relative;
      background:
        radial-gradient(circle at 18% 16%, rgba(125,211,252,.16), transparent 20%),
        radial-gradient(circle at 82% 12%, rgba(96,165,250,.14), transparent 20%),
        linear-gradient(180deg, rgba(11,31,58,.95), rgba(16,42,76,.92));
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-right:1px solid rgba(255,255,255,.08);
      box-shadow:var(--shadow-strong);
      overflow:hidden;
      isolation:isolate;
    }
    .glass-dark::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 22%),
        radial-gradient(circle at top right, rgba(125,211,252,.10), transparent 24%);
      pointer-events:none;
      z-index:0;
    }
    .glass-dark::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:inherit;
      padding:1px;
      background:linear-gradient(180deg, rgba(125,211,252,.28), rgba(96,165,250,.10), rgba(255,255,255,.05));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events:none;
      z-index:1;
    }

    .hero-mesh{
      background:
        radial-gradient(circle at 20% 20%, rgba(125,211,252,.28), transparent 22%),
        radial-gradient(circle at 80% 18%, rgba(59,130,246,.28), transparent 24%),
        radial-gradient(circle at 70% 80%, rgba(14,165,233,.18), transparent 24%),
        linear-gradient(135deg, #071528 0%, #0d2342 42%, #12305d 100%);
      position:relative;
      overflow:hidden;
    }

    .hero-mesh::before,
    .hero-mesh::after{
      content:"";
      position:absolute;
      inset:auto;
      border-radius:999px;
      filter:blur(12px);
      opacity:.55;
      pointer-events:none;
    }

    .hero-mesh::before{
      width:240px;
      height:240px;
      top:-80px;
      right:-40px;
      background:radial-gradient(circle, rgba(125,211,252,.85), rgba(125,211,252,0));
    }

    .hero-mesh::after{
      width:220px;
      height:220px;
      bottom:-90px;
      left:-40px;
      background:radial-gradient(circle, rgba(59,130,246,.70), rgba(59,130,246,0));
    }

    .floating-orb{
      position:absolute;
      border-radius:999px;
      filter:blur(6px);
      opacity:.25;
      animation:floatOrb 8s ease-in-out infinite;
    }

    .orb-a{ width:110px; height:110px; background:#7dd3fc; top:16%; left:58%; }
    .orb-b{ width:76px; height:76px; background:#60a5fa; bottom:18%; right:22%; animation-delay:1.6s; }
    .orb-c{ width:52px; height:52px; background:#93c5fd; top:58%; left:18%; animation-delay:3.1s; }

    .fade-in { animation: fadeIn .45s ease-out forwards; }
    .slide-up { animation: slideUp .45s ease-out forwards; }
    .lift { transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
    .lift:hover { transform:translateY(-2px); box-shadow:var(--shadow-strong); }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:.4rem;
      padding:.45rem .8rem;
      border-radius:999px;
      font-size:.75rem;
      font-weight:700;
      letter-spacing:.06em;
      text-transform:uppercase;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.10);
      color:#dbeafe;
    }

    .stat-card{
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,252,.95));
      border:1px solid rgba(148,163,184,.16);
      border-radius:1.25rem;
      padding:1.1rem;
      box-shadow:0 16px 50px rgba(15,23,42,.08);
    }

    .stat-card::after{
      content:"";
      position:absolute;
      inset:auto -40px -40px auto;
      width:110px;
      height:110px;
      border-radius:999px;
      background:radial-gradient(circle, rgba(96,165,250,.16), transparent 65%);
    }

    .section-shell{
      max-width:1100px;
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:1.5rem;
    }

    .module-banner{
      position:relative;
      overflow:hidden;
      border-radius:1.75rem;
      padding:1.6rem;
      color:white;
      box-shadow:var(--shadow-strong);
    }

    .gradient-rose{ background:linear-gradient(135deg, #7f1d1d 0%, #be123c 40%, #fb7185 100%); }
    .gradient-blue{ background:linear-gradient(135deg, #0b1f3a 0%, #1d4ed8 48%, #60a5fa 100%); }
    .gradient-emerald{ background:linear-gradient(135deg, #064e3b 0%, #0f766e 48%, #2dd4bf 100%); }
    .gradient-indigo{ background:linear-gradient(135deg, #312e81 0%, #4338ca 48%, #60a5fa 100%); }

    .module-banner::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 80% 18%, rgba(255,255,255,.26), transparent 18%),
        radial-gradient(circle at 20% 80%, rgba(255,255,255,.18), transparent 25%);
      pointer-events:none;
    }

    .feature-card{
      background:linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.90));
      border:1px solid rgba(148,163,184,.18);
      border-radius:1.25rem;
      padding:1.2rem;
      box-shadow:0 14px 40px rgba(15,23,42,.08);
    }

    .section-header-card{
      position:relative;
      overflow:hidden;
      border-radius:1.5rem;
      padding:1.4rem;
      color:white;
      box-shadow:var(--shadow-strong);
    }

    .section-header-card::after{
      content:"";
      position:absolute;
      inset:auto;
      width:180px;
      height:180px;
      right:-60px;
      top:-60px;
      border-radius:999px;
      background:radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0));
    }

    .nav-btn{
      width:100%;
      text-align:left;
      padding:.9rem 1rem;
      border-radius:1rem;
      display:flex;
      gap:.8rem;
      align-items:flex-start;
      transition:all .22s ease;
      border:1px solid transparent;
    }

    .nav-btn:hover{
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.08);
      transform:translateX(2px);
    }

    .nav-btn.active-rose{ background:rgba(255,241,242,.98); color:#9f1239; border-color:rgba(251,113,133,.28); box-shadow:0 10px 24px rgba(251,113,133,.12); }
    .nav-btn.active-blue{ background:rgba(239,246,255,.98); color:#1d4ed8; border-color:rgba(96,165,250,.28); box-shadow:0 10px 24px rgba(59,130,246,.12); }
    .nav-btn.active-emerald{ background:rgba(236,253,245,.98); color:#0f766e; border-color:rgba(45,212,191,.26); box-shadow:0 10px 24px rgba(20,184,166,.12); }
    .nav-btn.active-indigo{ background:rgba(238,242,255,.98); color:#4338ca; border-color:rgba(129,140,248,.28); box-shadow:0 10px 24px rgba(99,102,241,.12); }

    .nav-icon{
      width:2rem;height:2rem;border-radius:.8rem;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.08); color:rgba(255,255,255,.82); flex-shrink:0;
    }

    .progress-track{ height:.6rem; border-radius:999px; background:rgba(226,232,240,.9); overflow:hidden; }
    .progress-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, #1d4ed8, #38bdf8); transition:width .35s ease; }

    .quiz-option{ transition:all .18s ease; }
    .quiz-option:hover{ transform:translateY(-1px); }

    .medical-grid{
      display:grid;
      grid-template-columns:repeat(12, minmax(0,1fr));
      gap:1rem;
    }

    .medical-card{
      border-radius:1.25rem;
      border:1px solid rgba(148,163,184,.16);
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,252,.96));
      box-shadow:0 16px 44px rgba(15,23,42,.08);
      overflow:hidden;
    }

    .medical-card-header{
      padding:1rem 1.1rem;
      border-bottom:1px solid rgba(226,232,240,.85);
      background:linear-gradient(180deg, rgba(248,250,252,.95), rgba(255,255,255,.92));
    }

    .clinical-shell{
      background:linear-gradient(180deg, rgba(8,15,30,.98), rgba(15,23,42,.96));
      border:1px solid rgba(96,165,250,.18);
      border-radius:1.35rem;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(15,23,42,.24);
    }

    .fade-swap { transition: opacity 280ms ease, transform 280ms ease; will-change: opacity, transform; }
    .swap-hidden { opacity: 0; transform: translateY(6px); pointer-events: none; }
    .swap-visible { opacity: 1; transform: translateY(0); }

    .dot-grid{
      background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
      background-size:16px 16px;
    }

    .pill{
      display:inline-flex;align-items:center;gap:.4rem;padding:.38rem .7rem;border-radius:999px;font-size:.73rem;font-weight:700;
      background:#eff6ff;color:#1d4ed8;border:1px solid rgba(96,165,250,.26);
    }

    .completion-shell{
      position:relative;
      overflow:hidden;
      border-radius:1.5rem;
      background:linear-gradient(135deg, #0f172a 0%, #0b1f3a 42%, #0f766e 100%);
      color:white;
      box-shadow:var(--shadow-strong);
    }

    .completion-shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 20% 20%, rgba(125,211,252,.18), transparent 20%),
        radial-gradient(circle at 80% 80%, rgba(45,212,191,.16), transparent 22%);
      pointer-events:none;
    }

    .mobile-only { display:none; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes floatOrb { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }

    @media (max-width: 1024px){
      .hero-actions{ flex-direction:column; align-items:flex-start; }
    }

    @media (max-width: 768px){
      .mobile-only { display:block; }
      .desktop-stats { display:none; }
      .section-shell { gap:1rem; }
    }
  
    .sidebar-glow{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
    }
    .sidebar-glow::before,
    .sidebar-glow::after{
      content:"";
      position:absolute;
      border-radius:999px;
      filter:blur(24px);
      opacity:.55;
      animation:sidebarFloat 10s ease-in-out infinite;
    }
    .sidebar-glow::before{
      width:180px;
      height:180px;
      top:4%;
      left:-32px;
      background:radial-gradient(circle, rgba(125,211,252,.32), rgba(125,211,252,0));
    }
    .sidebar-glow::after{
      width:220px;
      height:220px;
      bottom:10%;
      right:-54px;
      background:radial-gradient(circle, rgba(59,130,246,.28), rgba(59,130,246,0));
      animation-delay:2.2s;
    }
    .glow-edge{
      position:absolute;
      top:0;
      bottom:0;
      width:2px;
      right:0;
      background:linear-gradient(180deg, rgba(125,211,252,.06), rgba(125,211,252,.65), rgba(59,130,246,.18));
      box-shadow:0 0 18px rgba(125,211,252,.28);
      opacity:.88;
      z-index:2;
    }
    .brand-toggle-shell{
      display:flex;
      gap:.5rem;
      align-items:center;
      flex-wrap:wrap;
      margin-top:.95rem;
    }
    .brand-toggle{
      display:inline-flex;
      align-items:center;
      gap:.45rem;
      padding:.46rem .78rem;
      border-radius:999px;
      font-size:.67rem;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      background:rgba(255,255,255,.08);
      color:#e0f2fe;
      border:1px solid rgba(255,255,255,.10);
      transition:all .22s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    }
    .brand-toggle.active{
      background:linear-gradient(135deg, rgba(255,255,255,.96), rgba(224,242,254,.94));
      color:#0b1f3a;
      border-color:rgba(186,230,253,.8);
      box-shadow:0 10px 24px rgba(14,165,233,.18);
    }
    .brand-toggle .material-symbols-outlined{
      font-size:15px;
    }
    .sidebar-brand-block{
      position:relative;
      z-index:3;
    }
    .sidebar-section{
      position:relative;
      z-index:3;
    }
    .glass-panel{
      background:var(--panel);
      backdrop-filter:var(--glass);
      -webkit-backdrop-filter:var(--glass);
      border:1px solid var(--border);
      box-shadow:0 16px 48px rgba(2,6,23,.08);
    }
    .nav-btn{
      position:relative;
      overflow:hidden;
    }
    .nav-btn::after{
      content:"";
      position:absolute;
      inset:auto auto 0 0;
      width:0;
      height:2px;
      background:linear-gradient(90deg, rgba(125,211,252,.9), rgba(96,165,250,.65));
      transition:width .24s ease;
    }
    .nav-btn:hover::after,
    .nav-btn.active-rose::after,
    .nav-btn.active-blue::after,
    .nav-btn.active-emerald::after,
    .nav-btn.active-indigo::after{
      width:100%;
    }
    .hero-mesh{
      border:1px solid rgba(255,255,255,.10);
    }
    .hero-mesh .chip{
      box-shadow:0 8px 24px rgba(14,165,233,.16);
    }
    @keyframes sidebarFloat {
      0%,100% { transform:translateY(0px) translateX(0px); }
      50% { transform:translateY(-10px) translateX(6px); }
    }

  </style>


</head>

<script>
    // --- Data Configuration ---
    const appData = {
        modules: {
            'gap-1': {
                title: 'HRR Testing and Diagnostic Workflow',
                color: 'blue',
                sections: [
                    { id: 'intro', title: '', icon: 'biotech' },
                    { id: 'guidelines', title: 'Guidelines and Workflow Actions', icon: 'menu_book' },
                    { id: 'case-marcus', title: 'Case Study: Marcus', icon: 'person' },
                ]
            },
            'gap-2': {
                title: 'PARPi Efficacy, Sequencing, and Shared Decisions',
                color: 'purple',
                sections: [
                    { id: 'intro', title: 'Targeted Therapy Gap', icon: 'target' },
                    { id: 'pathways', title: 'Treatment Landscape', icon: 'alt_route' },
                    { id: 'case-arthur', title: 'Case Study: Arthur', icon: 'engineering' },
                ]
            },
            'gap-3': {
                title: 'AE Management Through the MDT',
                color: 'rose',
                sections: [
                    { id: 'intro', title: 'Adverse Event Management', icon: 'warning' },
                    { id: 'mdt', title: 'MDT Coordination', icon: 'groups' },
                    { id: 'case-james', title: 'Case Study: James', icon: 'account_circle' },
                ]
            },
            'resources': {
                title: 'Summary',
                color: 'indigo',
                sections: [
                    { id: 'summary', title: 'Clinical Takeaways', icon: 'fact_check' },
                ]
            }
        }
    };

    let activeModuleId = 'gap-1';
    let activeSectionId = 'intro';
    let quizStates = {};

    function getAllSections() {
      const list = [];
      for (const [moduleId, module] of Object.entries(appData.modules)) {
        module.sections.forEach(section => list.push({ moduleId, ...section, moduleTitle: module.title, color: module.color }));
      }
      return list;
    }

    function getSectionIndex(moduleId, sectionId) {
      const all = getAllSections();
      return all.findIndex(item => item.moduleId === moduleId && item.id === sectionId);
    }

    function getProgressPercent() {
      const index = getSectionIndex(activeModuleId, activeSectionId);
      const total = getAllSections().length;
      return ((index + 1) / total) * 100;
    }

    function colorClasses(color) {
      const map = {
        rose: {
          banner: 'gradient-rose',
          accentBtn: 'bg-rose-600 hover:bg-rose-700',
          text: 'text-rose-700',
          soft: 'bg-rose-50 border-rose-100',
          badge: 'bg-rose-100 text-rose-700 border-rose-200',
          ring: 'ring-rose-200',
          gradientText: 'from-rose-500 to-pink-500'
        },
        blue: {
          banner: 'gradient-blue',
          accentBtn: 'bg-blue-600 hover:bg-blue-700',
          text: 'text-blue-700',
          soft: 'bg-blue-50 border-blue-100',
          badge: 'bg-blue-100 text-blue-700 border-blue-200',
          ring: 'ring-blue-200',
          gradientText: 'from-blue-500 to-cyan-500'
        },

    function renderQuizComponent(id, question, options, correctIndex, explanation) {
        const state = quizStates[id] || { submitted: false, selected: null };
        const isCorrect = state.selected === correctIndex;

        const optionsHtml = options.map((opt, idx) => {
            let style = 'bg-white border-slate-200 hover:border-blue-300';
            let icon = '<div class="w-5 h-5 rounded-full border border-slate-300"></div>';

            if (!state.submitted && state.selected === idx) {
                style = 'bg-blue-50 border-blue-500 ring-2 ring-blue-200';
                icon = '<div class="w-5 h-5 rounded-full border border-blue-500 bg-white flex items-center justify-center"><div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div></div>';
            } else if (state.submitted) {
                if (idx === correctIndex) {
                    style = 'bg-emerald-50 border-emerald-300 ring-2 ring-emerald-200';
                    icon = '<div class="w-5 h-5 rounded-full bg-emerald-500 border-emerald-500 flex items-center justify-center"><span class="material-symbols-outlined text-white text-sm">check</span></div>';
                } else if (idx === state.selected) {
                    style = 'bg-red-50 border-red-300 ring-2 ring-red-200';
                    icon = '<div class="w-5 h-5 rounded-full border-red-500 flex items-center justify-center"><span class="material-symbols-outlined text-red-500 text-sm">close</span></div>';
                } else {
                    style = 'bg-slate-50 border-slate-200 opacity-60';
                }
            }

            const clickAttr = !state.submitted ? `onclick="selectQuizOption('${id}', ${idx})"` : '';
            return `<button ${clickAttr} class="quiz-option text-left w-full p-4 rounded-2xl border transition-all duration-200 flex items-start gap-3 mb-3 ${style}">
                ${icon}
                <span class="text-sm leading-relaxed ${state.submitted && idx === correctIndex ? 'font-bold text-emerald-900' : 'text-slate-700'}">${opt}</span>
            </button>`;
        }).join('');

        const feedback = state.submitted
            ? `<div class="mt-5 p-5 rounded-2xl border ${isCorrect ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-red-50 border-red-200 text-red-900'} fade-in">
                <div class="flex items-center gap-2 font-bold mb-2">
                    <span class="material-symbols-outlined">${isCorrect ? 'check_circle' : 'cancel'}</span>
                    ${isCorrect ? 'Correct' : 'Incorrect'}
                </div>
                <p class="text-sm leading-relaxed">${explanation}</p>
            </div>`
            : `<button onclick="submitQuiz('${id}', ${correctIndex})" class="mt-4 w-full py-3.5 rounded-2xl font-bold transition-all ${state.selected !== null ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-lg shadow-blue-600/20' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}" ${state.selected === null ? 'disabled' : ''}>Submit Answer</button>`;

        return `<div class="medical-card p-0 overflow-hidden my-6" id="${id}">
            <div class="medical-card-header flex items-center justify-between gap-4">
                <div>
                    <div class="pill">Knowledge Check</div>

                </div>
            </div>
            <div class="p-5 md:p-6">
                ${optionsHtml}
                ${feedback}
            </div>
        </div>`;
    }

    function initClinicalVideos() {
        const blocks = document.querySelectorAll('[data-clinical-video-block="1"]');
        if (!blocks.length) return;

        blocks.forEach(block => {
            const posterBtn = block.querySelector('[data-cv-poster]');
            const wrap = block.querySelector('[data-cv-wrap]');
            const replay = block.querySelector('[data-cv-replay]');
            const video = block.querySelector('[data-cv-video]');

            if (!posterBtn || !wrap) return;

            const showSim = () => {
                posterBtn.classList.add('swap-hidden');
                posterBtn.classList.remove('swap-visible');
                posterBtn.disabled = true;

                wrap.classList.remove('hidden');
                requestAnimationFrame(() => {
                    wrap.classList.remove('swap-hidden');
                    wrap.classList.add('swap-visible');
                });

                if (video) {
                    try {
                        video.currentTime = 0;
                        const playPromise = video.play();
                        if (playPromise && typeof playPromise.catch === 'function') {
                            playPromise.catch(() => {});
                        }
                    } catch (e) {}
                }
            };

            const resetSim = () => {
                if (video) {
                    try {
                        video.pause();
                        video.currentTime = 0;
                    } catch (e) {}
                }

                wrap.classList.add('swap-hidden');
                wrap.classList.remove('swap-visible');
                setTimeout(() => {
                    wrap.classList.add('hidden');
                    posterBtn.classList.remove('swap-hidden');
                    posterBtn.classList.add('swap-visible');
                    posterBtn.disabled = false;
                }, 260);
            };

            posterBtn.addEventListener('click', showSim);
            if (replay) replay.addEventListener('click', resetSim);
        });
    }

    function toggleSidebar() {
